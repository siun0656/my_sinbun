<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#2a1d17;color:var(--ink);font-family:'Nanum Myeongjo','Batang',serif;line-height:1.85;font-size:17px}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.roof{height:14px;background:repeating-linear-gradient(90deg,var(--cheong) 0 24px,var(--juk) 24px 48px,var(--hwang) 48px 72px,var(--nok) 72px 96px)}
.paper{background:var(--hanji);border:5px double var(--juk);padding:18px;margin-top:0}
h1{font-family:'Nanum Brush Script','Nanum Myeongjo',serif;font-size:2.3rem;line-height:1.2;margin:6px 0;text-align:center;color:var(--juk)}
.sub{text-align:center;margin:0 0 14px;color:#5a4636}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:#fff8e6;color:var(--ink);padding:10px 14px;border-radius:4px;text-align:left}
button:hover:not(:disabled){background:var(--hwang)}
button:focus-visible{outline:3px solid var(--cheong);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.cls{display:grid;gap:10px}
.cls button{border-width:3px}
.cls b{font-size:1.15rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{text-align:center}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:10px;font-size:.9rem}
.bar{height:11px;background:#d8c9a8;border:1px solid var(--ink)}
.bar i{display:block;height:100%;transition:width .4s}
.bag{margin:8px 0 12px;font-size:.92rem;min-height:2em;border-top:1px dashed #8a7358;padding-top:6px}
.turn{font-size:.85rem;color:#6b5540}
.scene{font-size:1.04rem;margin:8px 0 14px;white-space:pre-line}
.ch{display:grid;gap:9px}
.toast{margin-top:10px;font-weight:700;color:var(--cheong)}
.sh{display:grid;gap:9px}
.end p{margin:0 0 1.1em;opacity:0;transition:opacity 1.2s;text-indent:1em}
.end p.on{opacity:1}
.end h2{font-family:'Nanum Brush Script','Nanum Myeongjo',serif;font-size:2.1rem;text-align:center;margin:4px 0 14px;color:var(--juk)}
.modal{position:fixed;inset:0;background:rgba(20,12,8,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.modal .paper{max-width:560px;max-height:85vh;overflow:auto;width:100%}
.modal h3{margin:0 0 8px;color:var(--cheong)}
.modal li{margin-bottom:6px}
.dg{list-style:none;padding:0;margin:0;columns:1}
.dg li{padding:3px 0;border-bottom:1px dotted #a58c68}
.seen{color:var(--nok);font-weight:700}
.nope{color:#8a7a68}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.end p,.bar i{transition:none}}
</style>
</head>

['차가운 눈밤','성을 쌓던 겨울, 얼어붙은 돌을 나르던 당신의 숨이 점점 가늘어졌어요.','눈이 소복소복 내리던 밤, 이름 없는 영혼은 이슬처럼 사라졌어요. 이 이야기를 읽는 우리가 그 이름 없는 사람들을 기억해요.']],
평:[
['초가집의 약속','삼베옷을 입고 마주 선 작은 혼례. 초가집 아궁이는 임금님 방보다 따뜻했어요.','잡곡밥 한 그릇도 둘이 나누면 쌀밥 같았어요. 소박하지만 단단한 행복이 초가지붕 위로 피어올랐어요.'],
['칼날 위의 영웅','철제 무기를 쥔 손이 덜덜 떨렸지만 당신은 전쟁터의 맨 앞에 섰어요. 함성 속에서 당신의 이름이 처음 불렸어요.','전쟁이 끝난 뒤 왕은 당신을 불러 높은 벼슬을 내렸어요. "평민 출신 대장군"이라는 이름이 온 나라에 퍼졌어요.'],
['탑을 세운 마음 부자','당신은 가진 것을 모두 탑 세우는 일에 보탰어요. 곡식 한 줌 남지 않았지만 손은 오히려 가벼웠어요.','탑이 하늘 높이 올라간 날, 사람들은 당신을 마음 부자라고 불렀어요. 탑 그림자 아래 향 냄새가 오래오래 남았어요.'],
['빚쟁이 노비','흉년과 빚이 목을 조여 왔고, 끝내 당신은 빚을 갚으려고 자기 몸을 팔아 노비가 되었어요.','삼베 소매로 눈물을 훔치며 당신은 다짐했어요. "이 사슬은 내 대에서 끊을 거야."'],
['무너진 성벽의 영웅','성벽이 무너지던 순간, 당신은 동료들을 밀어내고 돌무더기 아래로 몸을 던졌어요.','성은 끝내 완성되었고, 성돌 하나하나에는 이름 없는 영웅의 땀과 용기가 스며 있었어요.']],
귀:[
['나라를 이끈 지배자','귀족 회의의 판이 당신의 한마디에 뒤집혔어요. 왕은 당신을 곁에 앉혔어요.','권력은 비단옷보다 무거웠지만, 당신은 끝까지 나라의 중요한 일을 올바르게 결정했어요.'],
['반짝이는 결혼식','이웃나라와의 결혼식은 눈부셨어요. 금과 은 장신구가 번쩍번쩍했지만 신부의 눈은 먼 곳을 보고 있었어요.','기와집 깊은 방에서 당신은 외로운 부귀영화를 헤아렸어요. 반짝이는 것이 다 행복은 아니었어요.'],
['금동 부처님의 빛','당신은 금동 부처님을 세워 흩어진 백성의 마음을 하나로 모았어요.','세월이 지나도 부처님의 빛은 변하지 않았고, 당신은 따뜻한 귀족으로 오래오래 기억되었어요.'],
['비단옷을 잃은 귀족','라이벌의 음모는 소리 없이 다가와 당신의 비단옷을 벗겼어요. 기와집의 문이 쾅 닫혔어요.','삼베옷을 입은 당신은 태어나서 처음으로 흙냄새를 맡았어요. 처음으로 진짜 하늘을 본 것 같았어요.'],
['놀기만 한 귀족의 최후','쌀밥과 금 장신구에만 푹 빠진 날들이 이어졌고, 곳간은 하나둘 텅 비었어요.','가문은 무너졌고 기와집의 불빛도 꺼졌어요. 화려했던 이름은 사람들 기억에서 사라졌어요.']]};
const SUMMARY=['신분 제도: 귀족, 평민, 천민으로 나뉘었고 신분에 따라 생활 모습이 달랐어요.','귀족은 땅과 노비가 많고 높은 관리가 되어 나라의 중요한 일을 정했어요.','평민은 대부분 농사를 짓고, 나라에 세금을 내고, 성이나 궁궐을 쌓는 일에 불려 갔어요.','천민은 대부분 노비로, 귀족의 땅에서 농사를 짓거나 주인집 일을 했어요.','옷: 저고리와 바지를 입었고, 높은 사람은 비단옷과 금·은 장신구, 평민은 주로 삼베옷을 입었어요.','음식: 높은 사람은 귀한 쌀, 평민은 보리·조 같은 잡곡을 주로 먹었어요.','집: 높은 사람은 기와집, 평민은 주로 초가집에서 살았어요.','종교: 백성의 마음을 모으고 왕의 힘을 키우려고 불교를 받아들여 절, 탑, 불상을 만들었어요. (금동 연가 7년명 여래 입상-고구려, 정림사지 오층 석탑-백제)','가야는 철로 무기와 갑옷을 만들고 팔 만큼 철 다루는 기술이 뛰어났고, 고분의 토기로 그때 생활을 짐작할 수 있어요.'];
let S={};
const store={get(){try{return JSON.parse(localStorage.getItem('samguk_saga_end')||'[]')}catch(e){return[]}},add(k){try{const a=this.get();if(!a.includes(k)){a.push(k);localStorage.setItem('samguk_saga_end',JSON.stringify(a))}}catch(e){}}};
const has=x=>S.bag.includes(x)||S.fl.has(x);
const cl=v=>Math.max(0,Math.min(100,v));
function home(){
 $('#app').innerHTML=`<h1>삼국시대 대서사시</h1><p class="sub">나는 누구로 태어날까? 내 선택이 내 인생을 바꿔요!</p><div class="cls">
 <button data-c="귀"><b>👑 귀족</b><br>300냥 부자! 비단옷, 기와집, 그리고 으스대는 라이벌들</button>
 <button data-c="평"><b>🌾 평민</b><br>40냥 알뜰살림! 농사, 세금, 씨름 대회, 그리고 단짝</button>
 <button data-c="천"><b>⛓️ 천민</b><br>10냥 뿐! 대신 꾀와 용기로 운명을 바꿔 보자</button></div>
 <div class="row"><button id="dg">📖 엔딩 도감 (${store.get().length}/15)</button><button id="sm">📜 역사 요약</button></div>`;
 document.querySelectorAll('.cls button').forEach(b=>b.onclick=()=>start(b.dataset.c));
 $('#dg').onclick=dogam;$('#sm').onclick=()=>modal('<h3>오늘 배운 삼국시대 역사</h3><ul>'+SUMMARY.map(s=>'<li>'+s+'</li>').join('')+'</ul>');
}
function modal(h){$('#mbox').innerHTML=h+'<div class="row"><button id="mc">닫기</button></div>';$('#modal').classList.add('on');$('#mc').onclick=()=>$('#modal').classList.remove('on')}
function dogam(){
 const seen=store.get();let h='<h3>엔딩 도감</h3>';
 for(const c of ['천','평','귀']){h+=`<b>${CN[c]}</b><ul class="dg">`+E[c].map((e,i)=>seen.includes(c+i)?`<li class="seen">✔ ${e[0]}</li>`:'<li class="nope">???? (미확인 서사)</li>').join('')+'</ul><br>'}
 modal(h);
}
function start(c){
 const s=START[c];
 S={c,hp:s[0],gold:s[1],vir:s[2],wit:s[3],bag:[],fl:new Set(),mem:[],t:0,si:0,qi:0,qz:QZ.map(q=>q).sort(()=>Math.random()-.5)};
 next();
}
function hud(){
 const bars=[['체력',S.hp,'#b23a2e'],['마음씨',S.vir,'#2f6b4f'],['똑똑함',S.wit,'#1f5c6b']];
 const bag=S.bag.length?S.bag.map(i=>ITEMS[i][0]).join(' · '):'비어 있음';
 return `<div class="turn">${CN[S.c]} · ${S.t+1} / ${SEQ.length}장</div><div class="hud">${bars.map(b=>`<div>${b[0]} ${b[1]}<div class="bar"><i style="width:${b[1]}%;background:${b[2]}"></i></div></div>`).join('')}<div>💰 <b>${S.gold}</b>냥</div></div><div class="bag">🎒 가방: ${bag}</div>`;
}
function next(){
 if(S.hp<=0||S.t>=SEQ.length)return end();
 const k=SEQ[S.t];
 if(k==='s')scene();else if(k==='h')shop();else quiz();
}
function scene(){
 const sc=SC[S.c][S.si];
 $('#app').innerHTML=hud()+`<div class="scene">${sc.x}</div><div class="ch" id="ch"></div><div class="toast" id="ts"></div>`;
 sc.c.forEach(ch=>{
  const b=document.createElement('button');const ok=!ch.n||has(ch.n);
  b.textContent=(ok?'':'🔒 ['+(ITEMS[ch.n]?ITEMS[ch.n][0]+' 필요':'지난 이야기가 열쇠!')+'] ')+ch.t;b.disabled=!ok;
  b.onclick=()=>{apply(ch.e,ch);S.si++;done(ch.e)};
  $('#ch').appendChild(b);
 });
 const locked=sc.c.filter(c=>c.n&&!has(c.n)).length;
 if(locked)$('#ts').textContent='🔒 가방 속 물건이나 지난 선택이 있으면 열리는 길이 있어요!';
}
function apply(e,ch){
 S.hp=cl(S.hp+e[0]);S.gold=Math.max(0,S.gold+e[1]);S.vir=cl(S.vir+e[2]);S.wit=cl(S.wit+e[3]);
 if(ch&&ch.f)S.fl.add(ch.f);if(ch&&ch.m)S.mem.push(ch.m);
}
function done(e){
 const t=e.map((v,i)=>v?HEAD[i]+(v>0?' +':' ')+v:'').filter(Boolean).join('  ');
 document.querySelectorAll('#ch button').forEach(b=>b.disabled=true);
 $('#ts').textContent=t||'조용히 시간이 흘렀습니다.';
 S.t++;setTimeout(next,1300);
}
function shop(){
 const L=SHOP[S.c];
 $('#app').innerHTML=hud()+`<div class="scene">${SHOPTXT[S.c]}</div><div class="sh" id="sh"></div><div class="row"><button id="go">다 샀어요! 출발~</button></div>`;
 Object.keys(L).forEach(k=>{
  const b=document.createElement('button');const own=S.bag.includes(k);
  b.textContent=`${ITEMS[k][0]} — ${L[k]}냥 (${ITEMS[k][1]})${own?' ✔ 샀어요':''}`;
  b.disabled=own||S.gold<L[k];
  b.onclick=()=>{S.gold-=L[k];S.bag.push(k);shop()};
  $('#sh').appendChild(b);
 });
 $('#go').onclick=()=>{S.t++;next()};
}
function quiz(){
 const q=S.qz[S.qi++];const opts=q[1].map((t,i)=>({t,ok:i===0})).sort(()=>Math.random()-.5);
 $('#app').innerHTML=hud()+`<div class="scene">📜 서당 훈장이 돌판을 내려놓으며 묻습니다.\n\n${q[0]}</div><div class="ch" id="ch"></div><div class="toast" id="ts"></div>`;
 opts.forEach(o=>{
  const b=document.createElement('button');b.textContent=o.t;
  b.onclick=()=>{
   document.querySelectorAll('#ch button').forEach(x=>x.disabled=true);
   if(o.ok){S.wit=cl(S.wit+10);S.vir=cl(S.vir+2);S.mem.push('서당에서 배운 역사 한 줄이 마음에 오래 남았고');$('#ts').textContent='⭕ 정답! 지혜 +10 · '+q[2]}
   else{S.hp=cl(S.hp-5);$('#ts').textContent='❌ 아쉬워요. 체력 -5 · '+q[2]}
   S.t++;setTimeout(next,2400);
  };
  $('#ch').appendChild(b);
 });
}
function pick(){
 const c=S.c,hp=S.hp;
 if(c==='천'){
  if(hp<=15)return 4;
  if(has('flee'))return 1;
  if(has('freed')&&has('cure'))return 0;
  if(has('forge')&&S.wit>=35)return 2;
  return 3;
 }
 if(c==='평'){
  if(hp<=15)return has('save')?4:3;
  if(S.gold<=0&&has('debt'))return 3;
  if(has('rank')&&has('war'))return 1;
  if(has('tower'))return 2;
  return 0;
 }
 if(has('weak')&&S.vir<35)return 3;
 if(has('greed')&&S.vir<40)return 4;
 if(has('built'))return 2;
 if(has('rule')&&S.wit>=55)return 0;
 if(has('marry'))return 1;
 return 0;
}
function end(){
 const i=S.hp<=0?4:pick();const e=E[S.c][i];
 if(S.hp<=0&&S.c==='귀')return fallback();
 store.add(S.c+i);
 const m=S.mem,ps=[e[1]];
 if(m[0])ps.push('돌이켜 보면, '+m.slice(0,2).join(' ')+'…');
 if(m[2])ps.push(m.slice(2,4).join(' ')+'…');
 if(m[4])ps.push(m.slice(4,7).join(' ')+'…');
 ps.push(S.bag.length?`가방 속 ${S.bag.map(x=>ITEMS[x][0]).join(', ')}이(가) 말없이 당신의 길을 지켜 주었어요. 마음씨 ${S.vir}, 똑똑함 ${S.wit}. 숫자로는 다 적을 수 없는 하루하루였어요.`:`가방은 끝내 비어 있었지만, 마음씨 ${S.vir}과 똑똑함 ${S.wit}만큼은 누구도 빼앗지 못했어요.`);
 ps.push(e[2]);
 $('#app').innerHTML=`<div class="end"><div class="turn">${CN[S.c]}의 엔딩</div><h2>${e[0]}</h2><div id="ps"></div><div class="row hide" id="rw"><button id="sm2">📜 오늘 배운 역사 요약 카드</button><button id="dg2">📖 엔딩 도감</button><button id="re">🔁 다른 인생 살기</button></div></div>`;
 ps.forEach((t,k)=>{const p=document.createElement('p');p.textContent=t;$('#ps').appendChild(p);
  setTimeout(()=>{p.classList.add('on');p.scrollIntoView({behavior:'smooth',block:'center'})},900+k*1800)});
 setTimeout(()=>{$('#rw').classList.remove('hide');$('#sm2').onclick=()=>modal('<h3>오늘 배운 삼국시대 역사</h3><ul>'+SUMMARY.map(s=>'<li>'+s+'</li>').join('')+'</ul>');$('#dg2').onclick=dogam;$('#re').onclick=home;$('#rw').scrollIntoView({behavior:'smooth',block:'end'})},900+ps.length*1800);
}
function fallback(){S.hp=1;end()}
home();
</script>
</body>
</html>
